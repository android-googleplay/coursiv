<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Notion: Build Your Life Hub</title>
  <desc id="description">A calm personal dashboard showing quick capture, today's tasks, and recent notes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#332a66" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="54" fill="url(#background)"/>
  <circle cx="1040" cy="110" r="170" fill="#ddd7ff" opacity=".65"/>
